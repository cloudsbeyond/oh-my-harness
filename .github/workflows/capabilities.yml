name: Capability core and package

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'bin/**'
      - 'extensions/dsh-*/**'
      - 'extensions/skill-source-management/**'
      - 'deploy/**'
      - 'config/default.json'
      - 'config/providers.example.json'
      - 'docs/**'
      - 'README.md'
      - 'README.zh.md'
      - 'LICENSE'
      - 'package.json'
      - 'package-lock.json'
      - 'cordis.patch.yml'
      - '.gitignore'
      - '.github/workflows/capabilities.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'bin/**'
      - 'extensions/dsh-*/**'
      - 'extensions/skill-source-management/**'
      - 'deploy/**'
      - 'config/default.json'
      - 'config/providers.example.json'
      - 'docs/**'
      - 'README.md'
      - 'README.zh.md'
      - 'LICENSE'
      - 'package.json'
      - 'package-lock.json'
      - 'cordis.patch.yml'
      - '.gitignore'
      - '.github/workflows/capabilities.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Node 24 / Linux offline-provider gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked public dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run core and package regressions with simulated upstreams
        run: npm test
      - name: Verify committed client is reproducible
        run: |
          npm run build:client
          git diff --exit-code -- extensions/dsh-capabilities/client.js
      - name: Verify actual npm tarball and detached outputs
        run: npm run verify:package
      # Native Codex generated SDK builds, Host installation, credentials,
      # provider requests and App playback/microphone acceptance are separate.
