# Load after the official Voice input bundle. It owns the shared registry,
# controller and composer. Bound its existing controller, never insert another.
- id: api-speech-to-text
  name: '@deepseek-ai/dsh-experimental-api-speech-to-text'
  config:
    maxDurationSeconds: 40
    maxAudioBytes: 1280044
- insert:
    - id: omh-voice-input
      name: oh-my-harness-voice-input
      config: {}
